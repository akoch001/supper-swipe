[build]
  # Publish only the files the page loads. Recipes reach the page through the function.
  command = "npm test && rm -rf _site && mkdir -p _site/icons _site/photos && cp photos/*.jpg _site/photos/ && cp index.html app.js shopping.js styles.css manifest.webmanifest robots.txt _site/ && cp icons/*.png _site/icons/"
  publish = "_site"

[functions]
  node_bundler = "esbuild"

# Private: Netlify's site-wide password covers every path, including /api. The API has no login
# of its own, so the password must stay on. Search engines are told to stay away as well.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
