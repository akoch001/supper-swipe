<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Supper Swipe history</title>
<meta name="theme-color" content="#f7f1e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#170d1a" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&family=Fraunces:opsz,wght,SOFT,WONK@9..144,600..900,100,1&display=swap">
<link rel="stylesheet" href="/styles.css">
<style>
  body { height: auto; }
  .hist { max-width: 560px; margin: 0 auto; padding: 18px 0 48px; }
  .hist h1 { font: 800 1.8rem/1.1 var(--display); font-variation-settings: "SOFT" 100, "WONK" 1; letter-spacing: -.02em; margin: 0 0 4px; }
  .hist .sub { color: var(--muted); margin: 0 0 20px; }
  .hist .sub a, .back { color: var(--link); font-weight: 700; }
  .hist h2 { font: 800 1.2rem/1.2 var(--display); margin: 26px 0 4px; }
  .hist .why { color: var(--muted); font-size: .9rem; margin: 0 0 10px; }
  .row { display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .tile { width: 48px; height: 48px; border-radius: 12px; overflow: hidden; display: grid; place-items: center; background: var(--surface-2); font: 26px/1 var(--emoji); }
  .tile img { width: 100%; height: 100%; object-fit: cover; }
  .row strong { display: block; font-weight: 800; line-height: 1.25; }
  .row span.facts { display: block; color: var(--muted); font-size: .88rem; margin-top: 2px; }
  .big { font: 800 1.4rem/1 var(--display); font-variant-numeric: tabular-nums; text-align: right; }
  .big small { display: block; font: 600 .7rem/1.2 var(--body); color: var(--muted); }
  .month { margin: 18px 0 2px; font-weight: 800; color: var(--muted); font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; }
  .event { display: grid; grid-template-columns: 56px 26px 1fr auto; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .event .day { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
  .event .kind { font: 18px/1 var(--emoji); text-align: center; }
  .event .what { min-width: 0; }
  .event .what b { font-weight: 700; }
  .event .what span { display: block; color: var(--muted); font-size: .82rem; }
  .event button { width: 40px; height: 40px; border: 0; border-radius: 50%; background: transparent; color: var(--muted); }
  .event button:active { background: var(--surface-2); }
  .empty { color: var(--muted); }
  .more { margin-top: 10px; background: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; color: var(--fg); }
</style>
</head>
<body>
<main class="hist">
  <p><a class="back" href="/">← Back to the app</a></p>
  <h1>Your history</h1>
  <p class="sub" id="sub">Loading.</p>
  <div id="out"></div>
</main>
<script src="/history.js"></script>
</body>
</html>
