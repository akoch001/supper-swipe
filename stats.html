<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Supper Swipe stats</title>
<meta name="theme-color" content="#f7f1e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#170d1a" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&family=Fraunces:opsz,wght,SOFT,WONK@9..144,600..900,100,1&display=swap">
<link rel="stylesheet" href="/styles.css">
<style>
  body { height: auto; }
  .stats { max-width: 560px; margin: 0 auto; padding: 18px 0 48px; }
  .stats h1 { font: 800 1.6rem/1.1 var(--display); font-variation-settings: "SOFT" 100, "WONK" 1; letter-spacing: -.02em; margin: 0 0 4px; }
  .stats .sub { color: var(--muted); margin: 0 0 18px; }
  .stats .sub a { color: var(--link); }
  .group { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 16px; }
  .group h2 { font: 800 1.2rem/1.2 var(--display); margin: 0 0 2px; }
  .seen { color: var(--muted); font-size: .9rem; margin: 0 0 12px; }
  .tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 14px; }
  .tile { background: var(--surface-2); border-radius: 12px; padding: 8px 4px; text-align: center; }
  .tile b { display: block; font: 800 1.3rem/1.1 var(--display); font-variant-numeric: tabular-nums; }
  .tile span { font-size: .72rem; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: .92rem; }
  th, td { padding: 6px 4px; text-align: right; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  th { font-weight: 700; color: var(--muted); font-size: .78rem; }
  td.zero { color: var(--muted); opacity: .55; }
  h3 { font: 700 .95rem/1.2 var(--body); margin: 16px 0 6px; }
  .bar { display: inline-block; height: 8px; border-radius: 4px; background: var(--pop); vertical-align: middle; margin-left: 6px; }
  .day-who { display: block; color: var(--muted); font-size: .78rem; font-weight: 500; }
  .more { margin-top: 10px; background: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; color: var(--fg); }
  .empty { color: var(--muted); }
  @media (max-width: 400px) { .tile b { font-size: 1.1rem; } th, td { padding: 6px 2px; font-size: .85rem; } }
</style>
</head>
<body>
<main class="stats">
  <h1>Who's swiping</h1>
  <p class="sub" id="sub">Loading.</p>
  <div id="groups"></div>
</main>
<script src="/stats.js"></script>
</body>
</html>
